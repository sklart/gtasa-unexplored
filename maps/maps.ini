; GTASA Unexplored external map pack v1.
; Every raster uses the same full-world (-3000..+3000) sa-world-v1 projection.
[pack]
format=1
projection=sa-world-v1
canvas_size=2048
name=GTASA Unexplored — San Andreas maps

[map]
kind=base
id=terrain
name_en=Terrain / satellite
name_ru=Рельеф / спутник
description_en=Detailed natural terrain and city layout.
description_ru=Детальная карта рельефа и городской застройки.
file=pack/terrain.png
credit=User-supplied source; see maps/MAP_PACK.md.

[map]
kind=base
id=official-high-res
name_en=Official high-resolution
name_ru=Официальная высокая детализация
description_en=Square map field extracted from the supplied Rockstar promotional poster.
description_ru=Квадратное поле карты, выделенное из предоставленного промопостера Rockstar.
file=pack/official-high-res.png
credit=User-supplied source; see maps/MAP_PACK.md.

[map]
kind=base
id=street
name_en=Standard street map
name_ru=Стандартная дорожная карта
description_en=Classic colour map with roads and settlements.
description_ru=Классическая цветная карта с дорогами и поселениями.
file=pack/street.png
credit=User-supplied source; see maps/MAP_PACK.md.

[map]
kind=base
id=definitive-edition
name_en=Definitive Edition
name_ru=Definitive Edition
description_en=The supplied Definitive Edition map rendering.
description_ru=Предоставленная карта из Definitive Edition.
file=pack/definitive-edition.png
credit=User-supplied source; see maps/MAP_PACK.md.

[map]
kind=base
id=geographic-regions
name_en=Geographic regions
name_ru=Географические регионы
description_en=Terrain map annotated with the major regions of San Andreas.
description_ru=Рельефная карта с обозначенными крупными регионами Сан-Андреаса.
file=pack/geographic-regions.png
credit=User-supplied source; see maps/MAP_PACK.md.
