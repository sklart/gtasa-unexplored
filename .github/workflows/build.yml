name: Build GTASA Unexplored

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate collectible pack and generated metadata
        run: |
          python3 tools/apply_collectible_crosswalk.py --check
          python3 tools/validate_collectible_pack.py --metadata-only
          python3 tools/validate_collectible_pack.py
          python3 tools/generate_collectible_info.py --check
          python3 tools/validate_poi_pack.py
          python3 tools/generate_poi_info.py --check
          python3 tests/map_manifest_tests.py
      - name: Build and run parser regression test
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
            tests/parser_tests.cpp source/SaveParser.cpp source/TagData.cpp \
            -o parser-tests
          ./parser-tests
      - name: Build host inspector
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
            tools/inspect_save.cpp source/SaveParser.cpp source/TagData.cpp \
            -o inspect-save
      - name: Build and run collectible metadata test
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
            tests/collectible_info_tests.cpp source/CollectibleInfoData.cpp \
            -o collectible-info-tests
          ./collectible-info-tests
      - name: Build and run collectible view test
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
            tests/collectible_view_tests.cpp source/CollectibleView.cpp source/CollectibleInfoData.cpp \
            -o collectible-view-tests
          ./collectible-view-tests
      - name: Build and run map UI math test
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
            tests/map_ui_tests.cpp -o map-ui-tests
          ./map-ui-tests
      - name: Build and run POI category test
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
            tests/poi_categories_tests.cpp source/PoiCategories.cpp source/PoiInfoData.cpp \
            -o poi-categories-tests
          ./poi-categories-tests
      - name: Build and run nearest collectible test
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
            tests/nearest_collectible_tests.cpp source/NearestCollectible.cpp source/RegionFilters.cpp source/RegionProgress.cpp source/CollectibleView.cpp source/CollectibleInfoData.cpp \
            -o nearest-collectible-tests
          ./nearest-collectible-tests
      - name: Build and run region progress test
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
            tests/region_progress_tests.cpp source/RegionProgress.cpp source/CollectibleView.cpp source/CollectibleInfoData.cpp \
            -o region-progress-tests
          ./region-progress-tests
      - name: Build and run favorites persistence test
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
            tests/favorites_tests.cpp source/Favorites.cpp -o favorites-tests
          ./favorites-tests
      - name: Build and run object list test
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
            tests/object_list_tests.cpp source/ObjectList.cpp source/Favorites.cpp source/RegionFilters.cpp source/RegionProgress.cpp source/PoiRegions.cpp source/PoiCategories.cpp source/CollectibleView.cpp source/CollectibleInfoData.cpp source/PoiInfoData.cpp -o object-list-tests
          ./object-list-tests
      - name: Build and run POI regions, route and matrix tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/poi_regions_tests.cpp source/PoiRegions.cpp source/PoiInfoData.cpp -o poi-regions-tests
          ./poi-regions-tests
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/route_planner_tests.cpp source/RoutePlanner.cpp source/RegionFilters.cpp source/RegionProgress.cpp source/CollectibleView.cpp source/CollectibleInfoData.cpp -o route-planner-tests
          ./route-planner-tests
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/progress_matrix_tests.cpp source/ProgressMatrix.cpp source/RegionProgress.cpp source/CollectibleView.cpp source/CollectibleInfoData.cpp -o progress-matrix-tests
          ./progress-matrix-tests
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/route_navigation_tests.cpp source/RouteNavigation.cpp -o route-navigation-tests
          ./route-navigation-tests
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/filters_ui_tests.cpp source/FiltersUi.cpp -o filters-ui-tests
          ./filters-ui-tests
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/screens_tests.cpp source/FiltersUi.cpp source/FiltersScreen.cpp source/RouteNavigation.cpp source/ObjectListScreen.cpp -o screens-tests
          ./screens-tests

  host-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ASan and UBSan parser regression test
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude \
            tests/parser_tests.cpp source/SaveParser.cpp source/TagData.cpp -o parser-sanitized
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ./parser-sanitized
      - name: ASan and UBSan UI/view tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude \
            tests/map_ui_tests.cpp -o map-ui-sanitized
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ./map-ui-sanitized
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude \
            tests/collectible_view_tests.cpp source/CollectibleView.cpp source/CollectibleInfoData.cpp -o collectible-view-sanitized
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ./collectible-view-sanitized
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude \
            tests/nearest_collectible_tests.cpp source/NearestCollectible.cpp source/RegionFilters.cpp source/RegionProgress.cpp source/CollectibleView.cpp source/CollectibleInfoData.cpp -o nearest-collectible-sanitized
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ./nearest-collectible-sanitized
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude \
            tests/region_progress_tests.cpp source/RegionProgress.cpp source/CollectibleView.cpp source/CollectibleInfoData.cpp -o region-progress-sanitized
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ./region-progress-sanitized
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude \
            tests/poi_categories_tests.cpp source/PoiCategories.cpp source/PoiInfoData.cpp -o poi-categories-sanitized
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ./poi-categories-sanitized
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude \
            tests/favorites_tests.cpp source/Favorites.cpp -o favorites-sanitized
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ./favorites-sanitized
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude \
            tests/object_list_tests.cpp source/ObjectList.cpp source/Favorites.cpp source/RegionFilters.cpp source/RegionProgress.cpp source/PoiRegions.cpp source/PoiCategories.cpp source/CollectibleView.cpp source/CollectibleInfoData.cpp source/PoiInfoData.cpp -o object-list-sanitized
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ./object-list-sanitized
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude tests/poi_regions_tests.cpp source/PoiRegions.cpp source/PoiInfoData.cpp -o poi-regions-sanitized
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ./poi-regions-sanitized
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude tests/route_planner_tests.cpp source/RoutePlanner.cpp source/RegionFilters.cpp source/RegionProgress.cpp source/CollectibleView.cpp source/CollectibleInfoData.cpp -o route-planner-sanitized
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ./route-planner-sanitized
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude tests/progress_matrix_tests.cpp source/ProgressMatrix.cpp source/RegionProgress.cpp source/CollectibleView.cpp source/CollectibleInfoData.cpp -o progress-matrix-sanitized
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ./progress-matrix-sanitized
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude tests/route_navigation_tests.cpp source/RouteNavigation.cpp -o route-navigation-sanitized
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ./route-navigation-sanitized
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude tests/filters_ui_tests.cpp source/FiltersUi.cpp -o filters-ui-sanitized
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ./filters-ui-sanitized
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude tests/screens_tests.cpp source/FiltersUi.cpp source/FiltersScreen.cpp source/RouteNavigation.cpp source/ObjectListScreen.cpp -o screens-sanitized
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ./screens-sanitized

  switch-build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Update toolchain and install SDL dependencies
        run: |
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --needed --noconfirm switch-sdl2 switch-sdl2_ttf switch-sdl2_image
      - name: Build NRO
        run: make -j2
      - name: Build installable Switch package
        run: python3 tools/package_switch.py
      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: gtasa-unexplored-nro
          path: gtasa-unexplored.nro
          if-no-files-found: error
      - name: Upload installable Switch package
        uses: actions/upload-artifact@v4
        with:
          name: gtasa-unexplored-switch-package
          path: gtasa-unexplored-switch.zip
          if-no-files-found: error
